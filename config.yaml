app:
  port: 9191
  ca_bundle: /etc/pki/tls/certs/ca-bundle.crt

cm:
  username: admin
  password: changeme
  request_timeout: 120

explorer:
  chunk_hours: 0.05
  chunk_limit: 1000

clusters:
  # 클러스터를 임시로 비활성화하려면 해당 항목에 enabled: false 추가
  # (필드 자체를 생략하거나 true로 두면 활성 상태)
  - id: cluster1
    color: "#4f8ef7"
    cm:
      host: cm1.internal
      port: 7183
      api_version: v57
      cluster_name: CDP-Base
    coordinators:
