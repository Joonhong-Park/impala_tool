<!-- ── 쿼리 상세 모달 ── -->
<div id="modal-overlay" onclick="closeModal(event)">
  <div id="modal">
    <div id="modal-header">
      <span style="font-size:12px;color:#8892a4">Query ID</span>
      <span id="modal-query-id"></span>
      <button id="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-tabs">
      <div class="modal-tab active" data-pane="summary" onclick="switchModalTab(this)">Summary</div>
      <div class="modal-tab" data-pane="statement" onclick="switchModalTab(this)">Statement</div>
      <div class="modal-tab" data-pane="plan" onclick="switchModalTab(this)">Plan</div>
      <div class="modal-tab" data-pane="profile" onclick="switchModalTab(this)">Profile</div>
    </div>
    <div class="modal-body">
      <div class="modal-pane active" id="pane-summary">
        <div class="meta-grid" id="modal-meta"></div>
      </div>
      <div class="modal-pane" id="pane-statement">
        <pre class="profile-pre" id="modal-stmt"></pre>
      </div>
      <div class="modal-pane" id="pane-plan">
        <pre class="profile-pre" id="modal-plan">불러오는 중…</pre>
      </div>
      <div class="modal-pane" id="pane-profile">
        <div class="profile-actions">
          <button class="btn-dl" id="dl-text">⬇ Text</button>
          <button class="btn-dl" id="dl-json">⬇ JSON</button>
          <button class="btn-dl" id="dl-thrift">⬇ Thrift</button>
        </div>
        <pre class="profile-pre" id="modal-profile">불러오는 중…</pre>
      </div>
    </div>
  </div>
</div>
